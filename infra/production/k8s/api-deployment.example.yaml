apiVersion: apps/v1
kind: Deployment
metadata:
  name: payfound-api
spec:
  replicas: 3
  selector:
    matchLabels: {app: payfound-api}
  template:
    metadata:
      labels: {app: payfound-api}
    spec:
      containers:
      - name: api
        image: registry.example.com/payfound/api:REPLACE_WITH_IMMUTABLE_VERSION
        ports:
        - {containerPort: 8000}
        env:
        - {name: DEMO_MODE, value: 'false'}
        - name: DATABASE_URL
          valueFrom: {secretKeyRef: {name: payfound-api-env, key: DATABASE_URL}}
        - name: SUPABASE_JWKS_URL
          valueFrom: {secretKeyRef: {name: payfound-api-env, key: SUPABASE_JWKS_URL}}
        readinessProbe:
          httpGet: {path: /api/health, port: 8000}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /api/health, port: 8000}
          initialDelaySeconds: 20
        resources:
          requests: {cpu: 200m, memory: 256Mi}
          limits: {cpu: '1', memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: payfound-api}
spec:
  selector: {app: payfound-api}
  ports: [{port: 80, targetPort: 8000}]
