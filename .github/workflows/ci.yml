name: PayFound
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: payfound_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements.lock }
      - run: pip install -r requirements.lock
      - name: Regression tests
        env:
          PAYFOUND_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:postgres@127.0.0.1:5432/payfound_test' || '' }}
        run: PYTHONPATH=. python -m pytest -q
      - name: Migration drift check
        env:
          PAYFOUND_TESTING: "1"
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:postgres@127.0.0.1:5432/payfound_test' || 'sqlite:///./migration_check.db' }}
        run: |
          python -c "from app.database import Base,engine; import app.main; Base.metadata.drop_all(engine)"
          alembic upgrade head
          alembic check
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m venv apps/api/.venv && apps/api/.venv/bin/pip install -r apps/api/requirements.lock
      - run: npm ci --prefix apps/web
      - run: pip install playwright==1.62.0 && python -m playwright install --with-deps chromium
      - run: apps/api/.venv/bin/python scripts/dev.py --demo --background
      - name: Wait for frontend
        run: python -c "import time,urllib.request; exec('for i in range(90):\n try:\n  urllib.request.urlopen(\"http://127.0.0.1:5173\",timeout=1); break\n except OSError: time.sleep(1)\nelse: raise RuntimeError(\"Web startup failed\")')"
      - run: python scripts/browser_check.py
      - run: python scripts/feature_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: browser-evidence, path: docs/evidence/ }
